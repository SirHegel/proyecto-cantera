name: Verificación de Cantera

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cantera-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANTERA_MODE: local
  PROVIDER_MODE: fixture
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  portable:
    name: Node 24 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Flujo completo · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Preparar navegador
        shell: bash
        run: |
          if command -v google-chrome > /dev/null; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run build
      - run: npm run test:e2e
      - name: Informe del navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
